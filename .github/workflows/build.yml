name: Build AIZARO

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android Licenses
        run: yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.9

      - name: Unzip Folders
        run: |
          unzip folders.zip
          # Agar folders ek dusre folder ke andar hain toh bahar nikalna
          if [ -d "Aizaro" ]; then mv Aizaro/* .; fi

      - name: Fix local.properties
        run: |
          # Agar local.properties galti se upload ho gayi hai toh use delete karo
          rm -f local.properties
          # Naya sahi local.properties banao
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Build APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AIZARO-APK
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
