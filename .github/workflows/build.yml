name: Build AIZARO Mod

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" || true

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.9

      - name: Unzip Source
        run: |
          if [ -f "src.zip" ]; then unzip src.zip; elif [ -f "folders.zip" ]; then unzip folders.zip; fi

      - name: Fix Missing Google Repo in Settings.gradle
        run: |
          GRADLEW_PATH=$(find . -name "gradlew" -type f | head -n 1)
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          
          # Settings.gradle ko overwrite karo taaki google() add ho jaye
          cat > "$PROJECT_DIR/settings.gradle" << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AIZARO"
          include ':app'
          EOF

      - name: Locate Project & Build
        run: |
          GRADLEW_PATH=$(find . -name "gradlew" -type f | head -n 1)
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          cd "$PROJECT_DIR"
          
          rm -f local.properties
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          
          # System gradle use karo
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AIZARO-APK
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
