name: Build AIZARO APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Extract Source Code
      run: |
        # Zip file ko extract karo ek naye folder mein
        unzip src.zip -d extracted_project
        
    - name: Fix Gradle Version
      run: |
        # Purane Gradle 6.1.1 ko naye 8.9 se replace karo
        find extracted_project -name "gradle-wrapper.properties" -exec sed -i 's/6.1.1/8.9/g' {} +
        
    - name: Grant Execute Permission
      run: |
        cd extracted_project
        chmod +x gradlew

    - name: Build APK
      run: |
        cd extracted_project
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: AIZARO-Debug-APK
        path: extracted_project/**/*.apk
