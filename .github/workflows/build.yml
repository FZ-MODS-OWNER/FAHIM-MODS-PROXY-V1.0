- name: Grant Execute Permission
  run: |
    # gradlew file ka exact path find karo
    GRADLEW_PATH=$(find extracted_project -name "gradlew" -type f | head -n 1)
    if [ -z "$GRADLEW_PATH" ]; then
      echo "Error: gradlew not found!"
      exit 1
    fi
    echo "Found gradlew at: $GRADLEW_PATH"
    chmod +x "$GRADLEW_PATH"
    # Root directory ko save karo for later use
    echo "PROJECT_ROOT=$(dirname "$GRADLEW_PATH")" >> $GITHUB_ENV

- name: Build APK
  working-directory: ${{ env.PROJECT_ROOT }}
  run: ./gradlew assembleDebug

- name: Upload APK
  uses: actions/upload-artifact@v4
  with:
    name: AIZARO-Debug-APK
    path: ${{ env.PROJECT_ROOT }}/**/*.apk
