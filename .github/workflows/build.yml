name: Build AIZARO Mod

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android NDK (C++ ke liye)
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Setup Gradle (Naya version)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Unzip Source
        run: |
          if [ -f "src.zip" ]; then
            unzip src.zip
          elif [ -f "folders.zip" ]; then
            unzip folders.zip
          fi

      - name: Locate Project & Fix Files
        run: |
          # Find gradlew to know where project root is
          GRADLEW_PATH=$(find . -name "gradlew" -type f | head -n 1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "Error: gradlew nahi mila! ZIP check karo."
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          
          # Remove local.properties (jo PC ke liye tha)
          rm -f "$PROJECT_DIR/local.properties"
          echo "sdk.dir=$ANDROID_HOME" > "$PROJECT_DIR/local.properties"

      - name: Build with Global Gradle
        run: |
          cd $PROJECT_DIR
          # Purane gradlew ko ignore karke seedha system gradle chalao
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AIZARO-APK
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
